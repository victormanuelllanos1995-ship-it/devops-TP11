name: Terraform PR Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Terraform Plan and Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -refresh=false -lock=false -no-color \
            -var="postgres_password=validation-only" > plan.txt
          cat plan.txt

      - name: Comment Terraform Plan
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        env:
          PLAN: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('plan.txt')
              ? fs.readFileSync('plan.txt', 'utf8')
              : 'Terraform Plan no pudo ejecutarse. Revisar los logs del workflow.';

            const body = `### Terraform Plan

            **Resultado:** ${process.env.PLAN}

            \`\`\`text
            ${plan.slice(0, 60000)}
            \`\`\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
