name: Terraform CD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Terraform Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -input=false -refresh=false -lock=false \
            -var="postgres_password=validation-only"

      - name: Deployment limitation
        run: |
          echo "::warning::Apply real pendiente."
          echo "Se necesita un backend de estado persistente y acceso al Docker host."
