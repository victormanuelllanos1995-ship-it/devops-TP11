name: Terraform CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-check:
    name: Terraform Deployment Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -refresh=false -lock=false -var="postgres_password=validation-only"
